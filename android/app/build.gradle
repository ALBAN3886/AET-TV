plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-parcelize'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.albaneloh.iptv'
    compileSdk 36

    defaultConfig {
        applicationId "com.albaneloh.iptv"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        // Requis par la bibliothèque officielle com.wireguard.android:tunnel (features Java 8).
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    def media3_version = "1.10.1"

    implementation "androidx.core:core-ktx:1.16.0"
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "com.google.android.material:material:1.12.0"
    implementation "androidx.activity:activity-ktx:1.10.1"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.7"

    implementation "androidx.media3:media3-exoplayer:$media3_version"
    implementation "androidx.media3:media3-exoplayer-hls:$media3_version"
    implementation "androidx.media3:media3-ui:$media3_version"
    implementation "androidx.media3:media3-datasource:$media3_version"

    debugImplementation "androidx.fragment:fragment-testing:1.8.2"
    implementation "androidx.core:core-splashscreen:1.0.1"

    implementation platform("com.google.firebase:firebase-bom:33.7.0")
    implementation "com.google.firebase:firebase-analytics"
    // Réutilisés pour le module AET VPN (config des serveurs + rattachement au compte utilisateur).
    implementation "com.google.firebase:firebase-auth-ktx"
    implementation "com.google.firebase:firebase-firestore-ktx"

    // --- AET VPN : bibliothèque officielle WireGuard pour Android ---
    // Vérifie la dernière version publiée avant build : https://central.sonatype.com/artifact/com.wireguard.android/tunnel
    // Licence Apache-2.0, maintenue par WireGuard/Jason A. Donenfeld. Aucune primitive crypto réimplémentée ici.
    implementation "com.wireguard.android:tunnel:1.0.20230706"
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.0.4"

    // Stockage chiffré de la clé privée WireGuard générée sur l'appareil (jamais en clair, jamais envoyée).
    implementation "androidx.security:security-crypto:1.1.0-alpha06"

    // Coroutines pour les opérations réseau/Firestore asynchrones du module VPN.
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.8.1"
}
