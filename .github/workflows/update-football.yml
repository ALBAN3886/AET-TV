name: Mettre à jour les matchs de football

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: update-football
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger le dépôt
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Télécharger les matchs
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: node scripts/update-football.mjs

      - name: Enregistrer les nouvelles données
        run: |
          git config user.name "AET-TV Football Bot"
          git config user.email "actions@github.com"
          git add data/football-live.json

          if git diff --cached --quiet; then
            echo "Aucune modification."
            exit 0
          fi

          git commit -m "Actualiser les matchs de football"
          git push origin main
